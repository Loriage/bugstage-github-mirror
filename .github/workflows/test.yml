name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check committed renderer
        run: git diff --exit-code -- pb_hooks/vendor/source-markdown.js
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build pinned BugStage test image
        run: docker build --target bugstage -t bugstage-github-mirror:test -f docker/Dockerfile .
      - name: Test real BugStage hooks and API rules
        run: python3 tests/integration/run.py
